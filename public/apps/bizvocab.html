<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top 20 Business Vocabulary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flipped { transform: rotateY(180deg); }
        .flip-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-tap-highlight-color: transparent; background-color: #f3f4f6; }
        #app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #f8fafc;
            min-height: 100vh;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
            overflow-x: hidden;
        }
    </style>
</head>
<body class="text-slate-800 antialiased font-sans">
    <div id="app-container" class="flex flex-col h-screen">
        <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50 rounded-b-xl">
            <div class="flex items-center gap-2">
                <button id="back-btn" onclick="showSections()" class="hidden text-white/90 hover:text-white p-1 -ml-1">

                </button>
                <div class="flex-1">
                    <h1 class="text-xl font-bold text-center tracking-wide">BizVocab</h1>
                    <p id="header-sub" class="text-blue-100 text-xs text-center mt-1">Top 20 Business Vocabulary</p>
                </div>
                <span class="w-6"></span>
            </div>
        </header>
        <main class="flex-1 overflow-y-auto p-4 relative">

            <!-- SECTION PICKER -->
            <section id="tab-sections" class="tab-section pb-8">
                <div class="sticky top-0 bg-[#f8fafc] pt-2 pb-4 z-10">
                    <input type="text" id="globalSearch" onkeyup="globalSearch()" placeholder="Search all 290+ words..."
                           class="w-full p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm">
                </div>
                <div id="global-results" class="hidden space-y-3 mb-6"></div>
                <div id="section-list" class="grid grid-cols-2 gap-3"></div>
            </section>

            <!-- DICTIONARY -->
            <section id="tab-learn" class="tab-section hidden pb-24">
                <div class="sticky top-0 bg-[#f8fafc] pt-2 pb-4 z-10">
                    <input type="text" id="searchInput" onkeyup="filterDictionary()" placeholder="Search words..."
                           class="w-full p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm">
                </div>
                <div id="dictionary-list" class="space-y-4"></div>
            </section>

            <!-- FLASHCARDS -->
            <section id="tab-flashcards" class="tab-section hidden pb-28">
                <div class="flex flex-col mt-4">
                    <div class="text-center mb-4 text-slate-500 font-medium" id="flashcard-counter">Card 1 / 20</div>
                    <div class="perspective-1000 w-full h-80 cursor-pointer" onclick="flipCard()">
                        <div id="flashcard-inner" class="relative w-full h-full text-center transform-style-3d flip-transition shadow-lg rounded-2xl">
                            <div class="absolute w-full h-full bg-white rounded-2xl backface-hidden flex flex-col items-center justify-center border-2 border-blue-100 p-6">
                                <h2 id="fc-front-word" class="text-3xl font-bold text-blue-600 mb-2"></h2>
                                <p class="text-slate-400 text-sm mt-4">Tap to reveal meaning</p>
                            </div>
                            <div class="absolute w-full h-full bg-blue-600 text-white rounded-2xl backface-hidden rotate-y-180 flex flex-col items-center justify-center p-6">
                                <h3 class="text-xl font-bold mb-3 border-b border-blue-400 pb-2 w-full text-center">Meaning</h3>
                                <p id="fc-back-meaning" class="text-md mb-6 text-center leading-relaxed"></p>
                                <div class="bg-blue-700/50 p-3 rounded-lg w-full">
                                    <p id="fc-back-example" class="text-sm italic text-blue-50 text-center"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex justify-between items-center mt-8 gap-4">
                    <button onclick="prevCard()" class="flex-1 bg-slate-200 text-slate-700 py-3 rounded-xl font-semibold hover:bg-slate-300 active:bg-slate-400 transition">Previous</button>
                    <button onclick="nextCard()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 active:bg-blue-800 transition shadow-md">Next</button>
                </div>
            </section>

            <!-- QUIZ -->
            <section id="tab-quiz" class="tab-section hidden pb-24">
                <div id="quiz-intro" class="text-center mt-4">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 class="text-2xl font-bold text-slate-800 mb-2">Definition Quiz</h2>
                        <p class="text-slate-600 mb-6">Read the definition and choose the correct word. 10 questions per round.</p>
                        <button onclick="startQuiz()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg shadow-md active:transform active:scale-95 transition">Start Quiz</button>
                    </div>
                </div>
                <div id="quiz-game" class="hidden mt-4">
                    <div class="flex justify-between items-center mb-6">
                        <span id="quiz-progress" class="text-sm font-bold text-slate-500">Question 1 / 10</span>
                        <span id="quiz-score-display" class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-sm font-bold">Score: 0</span>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
                        <p id="quiz-pos" class="text-xs uppercase tracking-wide text-blue-600 font-bold mb-2"></p>
                        <p id="quiz-sentence" class="text-lg text-slate-800 leading-relaxed font-medium"></p>
                    </div>
                    <div id="quiz-options" class="space-y-3"></div>
                </div>
                <div id="quiz-result" class="hidden text-center mt-4">
                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div id="result-icon" class="text-6xl mb-4">🏆</div>
                        <h2 class="text-3xl font-bold text-slate-800 mb-2">Quiz Complete!</h2>
                        <p class="text-lg text-slate-600 mb-6">You scored <span id="final-score" class="font-bold text-blue-600"></span> out of <span id="final-total"></span>.</p>
                        <button onclick="startQuiz()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg shadow-md active:transform active:scale-95 transition">Play Again</button>
                    </div>
                </div>
            </section>
        </main>

        const POS_LABEL = { n: 'noun', v: 'verb', adj: 'adjective', adv: 'adverb', abbr: 'abbreviation', conj: 'conjunction', prep: 'preposition' };
        const SECTION_ICONS = {
            'Advertising': '📣', 'Banking': '🏦', 'Company Structure': '🏢', 'Contracts': '📜',
            'Employment': '👔', 'Import/Export': '🚢', 'Insurance': '🛡️', 'Law': '⚖️',
            'Marketing': '📊', 'Meetings': '🗓️', 'Money': '💰', 'Presentations': '🎤',
            'Selling': '🤝', 'British/American Financial Terms': '🇬🇧'
        };

        let currentSection = null;

        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function shuffleArray(array) {
            const a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
        function posLabel(p) { return p ? (POS_LABEL[p] || p) : ''; }

        /* ---------- SECTION PICKER ---------- */
        function renderSections() {
            const list = document.getElementById('section-list');
            list.innerHTML = Object.keys(VOCAB).map(name => `
                <button onclick="openSection('${esc(name).replace(/'/g, "\\'")}')"
                        class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 text-left active:scale-95 transition hover:border-blue-300">
                    <div class="text-2xl mb-2">${SECTION_ICONS[name] || '📘'}</div>
                    <div class="font-bold text-slate-800 text-sm leading-snug">${esc(name)}</div>
                    <div class="text-xs text-slate-400 mt-1">${VOCAB[name].length} words</div>
                </button>`).join('');
        }

        function showSections() {
            currentSection = null;
            document.querySelectorAll('.tab-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-sections').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.add('hidden');
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('header-sub').innerText = 'Top 20 Business Vocabulary';
        }

        function openSection(name) {
            currentSection = name;
            document.getElementById('header-sub').innerText = name;
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
            document.getElementById('searchInput').value = '';
            flashcardData = shuffleArray(VOCAB[name]);
            currentFlashcardIndex = 0;
            isFlipped = false;
            resetQuiz();
            switchTab('learn');
            document.querySelector('main').scrollTop = 0;
        }

        function globalSearch() {
            const q = document.getElementById('globalSearch').value.trim().toLowerCase();
            const results = document.getElementById('global-results');
            const sections = document.getElementById('section-list');
            if (q.length < 2) {
                results.classList.add('hidden');
                sections.classList.remove('hidden');
                return;
            }
            const hits = [];
            Object.keys(VOCAB).forEach(sec => {
                VOCAB[sec].forEach(item => {
                    if (item.w.toLowerCase().includes(q) || item.d.toLowerCase().includes(q)) hits.push({ sec, item });
                });
            });
            sections.classList.add('hidden');
            results.classList.remove('hidden');
            results.innerHTML = hits.length === 0
                ? '<p class="text-center text-slate-500 mt-6">No words found.</p>'
                : hits.slice(0, 60).map(h => `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                        <div class="flex items-baseline justify-between gap-2">
                            <h3 class="text-lg font-bold text-slate-800">${esc(h.item.w)}</h3>
                            <span class="text-[10px] uppercase tracking-wide text-blue-600 font-bold">${esc(h.sec)}</span>
                        </div>
                        ${h.item.p ? `<p class="text-xs text-slate-400 italic">${esc(posLabel(h.item.p))}</p>` : ''}
                        <p class="text-sm font-medium text-slate-600 border-l-2 border-blue-400 pl-3 py-1 bg-slate-50 rounded-r-md mt-2">${esc(h.item.d)}</p>
                    </div>`).join('');
        }

        /* ---------- TABS ---------- */
        function switchTab(tabId) {
            document.querySelectorAll('.tab-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            ['learn', 'flashcards', 'quiz'].forEach(id => {
                const btn = document.getElementById(`nav-${id}`);
                btn.classList.toggle('text-blue-600', id === tabId);
                btn.classList.toggle('text-slate-400', id !== tabId);
            });
            if (tabId === 'learn') renderDictionary(VOCAB[currentSection]);
            if (tabId === 'flashcards') loadFlashcard(currentFlashcardIndex);
        }

        /* ---------- DICTIONARY ---------- */
        function renderDictionary(data) {
            const list = document.getElementById('dictionary-list');
            const sorted = [...data].sort((a, b) => a.w.localeCompare(b.w));
            list.innerHTML = sorted.length === 0
                ? '<p class="text-center text-slate-500 mt-6">No words found.</p>'
                : sorted.map(item => `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col gap-2">
                        <div class="flex items-baseline gap-2 flex-wrap">
                            <h3 class="text-xl font-bold text-slate-800">${esc(item.w)}</h3>
                            ${item.p ? `<span class="text-xs text-slate-400 italic">${esc(posLabel(item.p))}</span>` : ''}
                        </div>
                        <p class="text-sm font-medium text-slate-600 border-l-2 border-blue-400 pl-3 py-1 bg-slate-50 rounded-r-md">${esc(item.d)}</p>
                    </div>`).join('');
        }

        function filterDictionary() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderDictionary(VOCAB[currentSection].filter(v => v.w.toLowerCase().includes(q) || v.d.toLowerCase().includes(q)));
        }

        /* ---------- FLASHCARDS ---------- */
        let currentFlashcardIndex = 0;
        let isFlipped = false;
        let flashcardData = [];

        function loadFlashcard(index) {
            if (!flashcardData.length) return;
            const item = flashcardData[index];
            document.getElementById('fc-front-word').innerText = item.w;
            document.getElementById('fc-back-meaning').innerText = item.d;
            document.getElementById('fc-back-example').innerText = item.p ? posLabel(item.p) : currentSection;
            document.getElementById('flashcard-counter').innerText = `Card ${index + 1} / ${flashcardData.length}`;
            if (isFlipped) {
                isFlipped = false;
                document.getElementById('flashcard-inner').classList.remove('flipped');
            }
        }
        function flipCard() {
            isFlipped = !isFlipped;
            document.getElementById('flashcard-inner').classList.toggle('flipped', isFlipped);
        }
        function nextCard() {
            currentFlashcardIndex = (currentFlashcardIndex + 1) % flashcardData.length;
            loadFlashcard(currentFlashcardIndex);
        }
        function prevCard() {
            currentFlashcardIndex = (currentFlashcardIndex - 1 + flashcardData.length) % flashcardData.length;
            loadFlashcard(currentFlashcardIndex);
        }

        /* ---------- QUIZ ---------- */
        let quizQuestions = [];
        let quizIndex = 0;
        let quizScore = 0;
        let quizLocked = false;

        function resetQuiz() {
            document.getElementById('quiz-intro').classList.remove('hidden');
            document.getElementById('quiz-game').classList.add('hidden');
            document.getElementById('quiz-result').classList.add('hidden');
        }

        function startQuiz() {
            const pool = VOCAB[currentSection];
            quizQuestions = shuffleArray(pool).slice(0, Math.min(10, pool.length));
            quizIndex = 0;
            quizScore = 0;
            document.getElementById('quiz-intro').classList.add('hidden');
            document.getElementById('quiz-result').classList.add('hidden');
            document.getElementById('quiz-game').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            quizLocked = false;
            const q = quizQuestions[quizIndex];
            const pool = VOCAB[currentSection].filter(v => v.w !== q.w);
            const options = shuffleArray([q, ...shuffleArray(pool).slice(0, 3)]);
            document.getElementById('quiz-progress').innerText = `Question ${quizIndex + 1} / ${quizQuestions.length}`;
            document.getElementById('quiz-score-display').innerText = `Score: ${quizScore}`;
            document.getElementById('quiz-pos').innerText = q.p ? posLabel(q.p) : currentSection;
            document.getElementById('quiz-sentence').innerText = q.d;
            document.getElementById('quiz-options').innerHTML = options.map((o, i) => `
                <button data-idx="${i}" onclick="checkAnswer(this, ${o.w === q.w})"
                        class="w-full text-left bg-white border border-slate-200 p-4 rounded-xl font-medium text-slate-700 shadow-sm active:scale-[0.99] transition hover:border-blue-300">
                    ${esc(o.w)}
                </button>`).join('');
        }

        function checkAnswer(btn, correct) {
            if (quizLocked) return;
            quizLocked = true;
            const buttons = document.querySelectorAll('#quiz-options button');
            const answer = quizQuestions[quizIndex].w;
            buttons.forEach(b => {
                if (b.innerText.trim() === answer) {
                    b.className = "w-full text-left bg-emerald-50 border-2 border-emerald-500 p-4 rounded-xl font-semibold text-emerald-800 shadow-sm";
                } else if (b === btn) {
                    b.className = "w-full text-left bg-red-50 border-2 border-red-400 p-4 rounded-xl font-semibold text-red-700 shadow-sm";
                } else {
                    b.className = "w-full text-left bg-white border border-slate-200 p-4 rounded-xl font-medium text-slate-400 shadow-sm";
                }
            });
            if (correct) quizScore++;
            document.getElementById('quiz-score-display').innerText = `Score: ${quizScore}`;
            setTimeout(() => {
                quizIndex++;
                if (quizIndex < quizQuestions.length) {
                    loadQuestion();
                } else {
                    document.getElementById('quiz-game').classList.add('hidden');
                    document.getElementById('quiz-result').classList.remove('hidden');
                    document.getElementById('final-score').innerText = quizScore;
                    document.getElementById('final-total').innerText = quizQuestions.length;
                    document.getElementById('result-icon').innerText = quizScore >= quizQuestions.length * 0.8 ? '🏆' : (quizScore >= quizQuestions.length * 0.5 ? '👍' : '📚');
                }
            }, 1100);
        }

        renderSections();
        showSections();
    </script>
</body>
